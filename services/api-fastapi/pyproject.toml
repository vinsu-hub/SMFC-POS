[project]
name = "api-fastapi"
version = "0.1.0"
description = "Saint Michael Food Corp central backend (Malaya routes live here)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "supabase>=2.9",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "groq>=0.11",
    "bcrypt>=4.1",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
